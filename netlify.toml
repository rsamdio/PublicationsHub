# PublicationsHub — Netlify Next.js

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Always send the default Netlify subdomain to the canonical custom domain.
[[redirects]]
  from = "https://publicationshub.netlify.app/*"
  to = "https://publications.rsamdio.org/:splat"
  status = 301
  force = true

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
